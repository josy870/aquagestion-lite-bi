services:
  airbyte-db:
    image: postgres:13-alpine
    container_name: airbyte-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airbyte
      POSTGRES_USER: airbyte
      POSTGRES_PASSWORD: airbyte
    volumes:
      - airbyte_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbyte -d airbyte"]
      interval: 10s
      timeout: 5s
      retries: 5

  airbyte-server:
    image: airbyte/server:0.50.11
    container_name: airbyte-server
    restart: unless-stopped
    depends_on:
      airbyte-db:
        condition: service_healthy
    environment:
      AIRBYTE_VERSION: 0.50.11
      CONFIG_ROOT: /data
      DATABASE_PASSWORD: airbyte
      DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      DATABASE_USER: airbyte
      TRACKING_STRATEGY: logging
      WORKER_ENVIRONMENT: docker
      LOG_LEVEL: WARN
      INTERNAL_API_HOST: airbyte-server:8001
      CONFIGS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: "0.35.15.001"
      JOBS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: "0.29.15.001"
    ports:
      - "8001:8001"
    volumes:
      - airbyte_data:/data
      - airbyte_workspace:/tmp/workspace
      - /var/run/docker.sock:/var/run/docker.sock

  airbyte-webapp:
    image: airbyte/webapp:0.50.11
    container_name: airbyte-webapp
    restart: unless-stopped
    depends_on:
      - airbyte-server
    environment:
      INTERNAL_API_HOST: airbyte-server:8001
    ports:
      - "8000:80"

  airbyte-temporal:
    image: airbyte/temporal:0.50.11
    container_name: airbyte-temporal
    restart: unless-stopped
    depends_on:
      airbyte-db:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: airbyte
      POSTGRES_PWD: airbyte
      POSTGRES_SEEDS: airbyte-db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"

  airbyte-worker:
    image: airbyte/worker:0.50.11
    container_name: airbyte-worker
    restart: unless-stopped
    depends_on:
      - airbyte-server
      - airbyte-temporal
    environment:
      AIRBYTE_VERSION: 0.50.11
      CONFIG_ROOT: /data
      DATABASE_PASSWORD: airbyte
      DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      DATABASE_USER: airbyte
      INTERNAL_API_HOST: airbyte-server:8001
      LOG_LEVEL: WARN
      TEMPORAL_HOST: airbyte-temporal:7233
      TRACKING_STRATEGY: logging
      WORKER_ENVIRONMENT: docker
      WORKSPACE_ROOT: /tmp/workspace
    volumes:
      - airbyte_workspace:/tmp/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - airbyte_data:/data

volumes:
  airbyte_db_data:
    name: airbyte_db_data
  airbyte_data:
    name: airbyte_data
  airbyte_workspace:
    name: airbyte_workspace
